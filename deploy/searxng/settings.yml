# KAYRON's private SearXNG configuration.
# The gateway in proxy.py protects /search with X-KAYRON-Search-Key.
use_default_settings: true

general:
  debug: false
  instance_name: "KAYRON Search"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "pt-BR"
  formats:
    - html
    - json

server:
  secret_key: "ultrasecretkey"
  limiter: false
  image_proxy: false
  method: "GET"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

valkey:
  url: false
